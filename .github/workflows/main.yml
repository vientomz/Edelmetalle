name: Edelmetallpreise Nachricht

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Kurse abrufen
        id: kurse
        run: |
          hole_preis() {
            SYMBOL=$1
            curl -s -A "Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/${SYMBOL}" \
              | jq -r '.chart.result[0].meta | "\(.regularMarketPrice)|\(.previousClose)"'
          }

          echo "gold=$(hole_preis 'GC=F')" >> "$GITHUB_OUTPUT"
          echo "silber=$(hole_preis 'SI=F')" >> "$GITHUB_OUTPUT"
          echo "platin=$(hole_preis 'PL=F')" >> "$GITHUB_OUTPUT"

      - name: Nachricht bauen und verschicken
        env:
          GOLD: ${{ steps.kurse.outputs.gold }}
          SILBER: ${{ steps.kurse.outputs.silber }}
          PLATIN: ${{ steps.kurse.outputs.platin }}
        run: |
          format_metall() {
            NAME=$1
            PAAR=$2
            echo "$PAAR" | awk -F'|' -v name="$NAME" '{
              preis = $1
              vortag = $2
              diff = ((preis - vortag) / vortag) * 100
              ad = diff < 0 ? -diff : diff

              if (diff >= 0) { pfeil = sprintf("📈 +%.2f%%", diff) }
              else { pfeil = sprintf("📉 %.2f%%", diff) }

              if (ad >= 3) { spruch = (diff > 0) ? "Krasser Sprung nach oben! 🚀" : "Ordentlicher Einbruch, aufpassen! ⚠️" }
              else if (ad >= 1) { spruch = (diff > 0) ? "Spürbar im Plus. 👍" : "Merklich runter heute. 👎" }
              else { spruch = "Ruhiger Tag, kaum Bewegung. 😐" }

              printf "%s: $%.2f %s\n%s\n\n", name, preis, pfeil, spruch
            }'
          }

          NACHRICHT="💰 Edelmetalle (USD/Feinunze)

          $(format_metall "Gold" "$GOLD")$(format_metall "Silber" "$SILBER")$(format_metall "Platin" "$PLATIN")"

          echo "$NACHRICHT"

          curl -s -H "Title: Edelmetallpreise 💰" \
               -d "$NACHRICHT" \
               ntfy.sh/vincent-edelmetalle
